<title>Planner</title>
<style>
:root{--ink:#111827;--mute:#6b7280;--line:#d1d5db;--alert:#dc2626;--alert-bg:#fee2e2;--alert-ink:#991b1b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font:16px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overscroll-behavior:none;color-scheme:light}
button{font:inherit;color:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;background:#fff}
.ib{border:0;background:#f3f4f6;border-radius:10px;min-width:36px;height:38px;font-size:20px;padding:0}
.pill{border:0;background:#f3f4f6;border-radius:10px;height:38px;padding:0 10px;font-size:14px;font-weight:600}
.ttl{text-align:center;min-width:100px;padding:0 2px}
.ttl b{display:block;font-size:16px}.ttl small{color:var(--mute);font-size:12px}
.sp{flex:1}
.badge{background:var(--alert);color:#fff;border-radius:9px;font-size:12px;padding:1px 6px;margin-left:4px}
#banner{display:none;background:var(--alert-bg);color:var(--alert-ink);font-size:14px;font-weight:600;padding:8px 12px;border-bottom:1px solid #fecaca}
#banner.on{display:block}
#tip{display:none;background:#f3f4f6;font-size:13px;padding:8px 12px;border-bottom:1px solid var(--line)}
#tip.on{display:block}#tip button{border:0;background:none;font-weight:700;margin-left:6px;text-decoration:underline}
#scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
#tl{position:relative}
.hl{position:absolute;left:52px;right:0;border-top:1px solid #9ca3af}
.hl.half{border-top:1px dashed #d1d5db}
.hlab{position:absolute;left:0;width:46px;text-align:right;font-size:11px;color:var(--mute);transform:translateY(-7px)}
.blk{position:absolute;left:58px;right:10px;border-radius:8px;color:#fff;padding:1px 8px;overflow:hidden;cursor:pointer}
.blk .t{font-weight:700;font-size:13px;line-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .s{font-size:11px;line-height:13px;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.done{opacity:.72}
.blk.tiny .t{font-size:12px;line-height:13px}
.mk{display:inline-block;background:#fff;border-radius:50%;width:15px;height:15px;line-height:15px;text-align:center;font-size:11px;margin-left:5px;font-weight:800}
#now{position:absolute;left:52px;right:0;height:0;border-top:2px solid var(--ink);z-index:5;pointer-events:none}
#now i{position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--ink)}
#fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 18px);width:58px;height:58px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:32px;line-height:56px;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:10}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:20}
#modal.on{display:flex}
#sheet{background:#fff;width:100%;max-height:94vh;max-height:94dvh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
#gate{position:fixed;inset:0;background:#fff;z-index:30;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 18px);overflow-y:auto}
#gate.on{display:flex}
.gtop{color:var(--alert);font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
h2{margin:6px 0 14px;font-size:24px}h3{margin:0 0 10px;font-size:19px}
.gcard{color:#fff;border-radius:14px;padding:14px;margin-bottom:16px;font-size:14px}.gcard b{font-size:20px;display:block;margin-bottom:4px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;border:0;border-radius:12px;min-height:50px;font-size:17px;font-weight:600;margin-top:10px;padding:8px 12px;text-align:center}
.btn.pri{background:var(--ink);color:#fff}.btn.sec{background:#f3f4f6}.btn.dng{background:var(--alert-bg);color:var(--alert-ink)}.btn:disabled{opacity:.35}
.in{width:100%;border:1px solid var(--line);border-radius:10px;height:44px;padding:0 10px;font-size:16px;background:#fff;margin-bottom:10px;color:var(--ink)}
.row{display:flex;gap:10px}.row label{flex:1;font-size:13px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{--c:#111827;border:2px solid var(--c);color:var(--c);background:#fff;border-radius:18px;padding:6px 12px;font-size:14px;font-weight:600}
.chip.sm{padding:6px 0;width:42px}
.chip.on{background:var(--c);color:#fff}
.chk{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:16px}.chk input{width:22px;height:22px}
.chk.big{background:#f3f4f6;border-radius:10px;padding:10px;font-size:15px}
.mute{color:var(--mute);font-size:13px}
.err{color:var(--alert);font-weight:600;font-size:14px;min-height:18px;margin:4px 0}
.seg2{display:flex;gap:14px;margin-bottom:10px;font-size:15px}.seg2 label{display:flex;gap:6px;align-items:center}
.prev{position:relative;height:26px;background:#fff;border:1px solid var(--line);border-radius:6px;margin:2px 0 2px}
.prev i{position:absolute;top:0;bottom:0;border-radius:3px}
.prev .g{border:2px solid var(--ink);background:rgba(17,24,39,.12)}.prev .g.bad{border-color:var(--alert);background:rgba(220,38,38,.18)}
.pl{position:relative;height:14px;font-size:10px;color:var(--mute);margin-bottom:4px}.pl span{position:absolute;transform:translateX(-50%)}
.bitem{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.bitem b{font-size:17px}
.bsw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.bact{display:flex;gap:8px;margin-top:8px}.bact .btn{margin-top:0;min-height:44px;font-size:15px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 90px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:50;display:none;max-width:90%}
#seg{display:flex;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);background:#fff}
#seg button{flex:1;border:0;background:#f3f4f6;border-radius:9px;height:32px;font-size:14px;font-weight:600}
#seg button.on{background:var(--ink);color:#fff}
#wk{display:none;position:relative;padding-bottom:90px}
.wkhead{position:relative;height:42px;border-bottom:1px solid #9ca3af}
.wkhead button{position:absolute;top:0;height:42px;border:0;background:none;font-size:11px;line-height:14px;padding:4px 0 0;color:var(--mute);text-align:center}
.wkhead button b{display:block;font-size:15px;line-height:20px;color:var(--ink)}
.wkhead button.today b{background:var(--ink);color:#fff;border-radius:10px;width:26px;margin:0 auto}
.wkbody{position:relative;margin-top:8px}
.wkl{position:absolute;left:34px;right:0;border-top:1px solid #d1d5db}
.wkl.half{border-top:1px dashed #e5e7eb}
.wklab{position:absolute;left:0;width:30px;text-align:right;font-size:9px;color:var(--mute);transform:translateY(-6px)}
.wkcol{position:absolute;top:0;bottom:0;margin:0;padding:0;border:0;border-left:1px solid #e5e7eb;background:none}
.wkb{position:absolute;border-radius:4px;color:#fff;font-size:9px;line-height:10px;padding:1px 3px;overflow:hidden;pointer-events:none;white-space:nowrap;text-overflow:ellipsis}
.wkb.done{opacity:.72}
#wnow{position:absolute;height:0;border-top:2px solid var(--ink);z-index:5;pointer-events:none;display:none}
#todo{border-bottom:1px solid var(--line);background:#fff}
.thead{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:#fff;padding:8px 12px;font-size:14px;font-weight:700;text-align:left;min-height:38px}
.thead span{color:var(--mute);font-weight:600;font-size:13px}
#tbody{padding:0 12px 10px;max-height:38vh;overflow-y:auto}
.titem{display:flex;align-items:center;gap:10px;min-height:40px}
.titem input[type=checkbox]{width:22px;height:22px;flex:none}
.titem .tx{flex:1;font-size:16px;word-break:break-word}
.titem.done .tx{text-decoration:line-through;color:var(--mute)}
.titem .x{border:0;background:none;color:var(--mute);font-size:18px;min-width:34px;height:36px}
.titem .mv{border:0;background:#f3f4f6;border-radius:8px;padding:0 10px;height:30px;font-size:13px;font-weight:600}
.tadd{display:flex;gap:8px;margin-top:6px}
.tadd .in{margin:0;flex:1;height:40px}
.tadd button{border:0;background:var(--ink);color:#fff;border-radius:10px;padding:0 14px;font-weight:600;height:40px}
.tlo{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 2px}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="ib" onclick="step(-1)" aria-label="Previous day">‹</button>
    <div class="ttl" id="ttl"></div>
    <button class="ib" onclick="step(1)" aria-label="Next day">›</button>
    <div class="sp"></div>
    <button class="pill" onclick="goToday()">Today</button>
    <button class="pill" onclick="openBank()">Bank<span class="badge" id="bankN" style="display:none"></span></button>
    <button class="ib" onclick="openMenu()" aria-label="Menu">⋯</button>
  </header>
  <div id="seg"><button data-m="day" onclick="setMode('day')">Day</button><button data-m="week" onclick="setMode('week')">Week</button></div>
  <div id="tip"></div>
  <div id="banner" onclick="openBank()"></div>
  <div id="todo"></div>
  <div id="scroll"><div id="tl"></div><div id="wk"></div></div>
</div>
<button id="fab" onclick="newEvent()" aria-label="New event">+</button>
<div id="modal"><div id="sheet"></div></div>
<div id="gate"></div>
<div id="toast"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const CATS = {
  class:{n:'Class',c:'#1d4ed8'}, study:{n:'Study',c:'#c2710c'},
  involvement:{n:'Involvement',c:'#7c3aed'}, health:{n:'Health',c:'#15803d'}, personal:{n:'Personal',c:'#475569'}
};
const REASONS = [['late','Previous event ran late'],['under','Underestimated the time needed'],['came_up','Something came up'],['no_want',"Didn't want to do it"]];
const LETGO = REASONS.concat([['no_matter','No longer matters']]);
const START = 360, END = 1320, H = 64, KEY = 'planner.v1', EXPIRE_DAYS = 4;

/* ---------- helpers ---------- */
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return ymd(d);}
function diffDays(a,b){return Math.round((parse(b)-parse(a))/864e5);}
function dow(s){return parse(s).getDay();}
function todayStr(){return ymd(new Date());}
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes();}
function fmtT(m){let h=Math.floor(m/60);const mm=m%60,ap=h>=12?'pm':'am';h=h%12||12;return h+(mm?':'+pad(mm):'')+ap;}
function toInT(m){return Number.isFinite(m)?pad(Math.floor(m/60))+':'+pad(m%60):'';}
function fromInT(s){if(!s)return NaN;const [h,m]=s.split(':').map(Number);return h*60+m;}
function fmtDate(d){return parse(d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});}
function fmtDur(m){const h=Math.floor(m/60),mm=m%60;return (h?h+'h ':'')+(mm?mm+'m':'')||'0m';}
function rel(d){const n=diffDays(todayStr(),d);return n===0?'Today':n===1?'Tomorrow':n===-1?'Yesterday':'';}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.display='none',2600);}

/* ---------- storage ---------- */
function fresh(){return {v:1,events:[],series:[],log:{},bank:[],todos:[],meta:{firstUse:todayStr(),showWeekends:false,lastBackup:null}};}
function load(){
  try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.v===1&&Array.isArray(j.events)&&Array.isArray(j.series)){j.meta=Object.assign(fresh().meta,j.meta||{});j.log=j.log||{};j.bank=j.bank||[];j.todos=Array.isArray(j.todos)?j.todos:[];return j;}}catch(e){}
  return fresh();
}
let S = load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('Could not save. Storage may be full or blocked.');}}

/* ---------- event model ---------- */
function seriesOn(sr,date){
  if(date<sr.from)return false; if(sr.until&&date>sr.until)return false;
  if(!sr.days.includes(dow(date)))return false; if(sr.skip.includes(date))return false; return true;
}
function instancesOn(date){
  const out=[];
  for(const e of S.events) if(e.date===date) out.push({key:e.id+'@'+date,id:e.id,kind:'one',date,title:e.title,start:e.start,end:e.end,cat:e.cat,note:e.note,critical:e.critical,origLen:e.origLen});
  for(const sr of S.series) if(seriesOn(sr,date)){
    const f=Object.assign({},sr,sr.over[date]||{});
    out.push({key:sr.id+'@'+date,id:sr.id,kind:'series',date,title:f.title,start:f.start,end:f.end,cat:f.cat,note:f.note,critical:f.critical,origLen:f.origLen});
  }
  out.sort((a,b)=>a.start-b.start);
  return out;
}
const occ = i => {const l=S.log[i.key];return !l||l.status==='done';};
function mk(i,status,x){return Object.assign({status,key:i.key,id:i.id,kind:i.kind,date:i.date,title:i.title,cat:i.cat,critical:!!i.critical,start:i.start,end:i.end,ts:Date.now()},x||{});}
function seriesStats(id){
  const l=Object.values(S.log).filter(x=>x.kind==='series'&&x.id===id&&['done','skipped','banked'].includes(x.status)).sort((a,b)=>a.date<b.date?1:-1).slice(0,4);
  return {n:l.length,skips:l.filter(x=>x.status!=='done').length};
}
function statLine(id){const s=seriesStats(id);return (s.n>=2&&s.skips>=2)?`<div class="mute" style="margin:0 0 10px">Skipped ${s.skips} of the last ${s.n} times.</div>`:'';}
function firstGap(date,dur){
  const occs=instancesOn(date).filter(occ);let t=480;
  if(date===todayStr())t=Math.max(t,Math.ceil((nowMin()+1)/30)*30);
  for(const i of occs){if(i.end<=t)continue;if(i.start-t>=dur)break;t=Math.max(t,i.end);}
  return t+dur<=END?t:null;
}

/* ---------- pending (check-in gate) ---------- */
function pending(){
  const today=todayStr(),nm=nowMin(),list=[];let changed=false;
  let d=addDays(today,-90);if(S.meta.firstUse>d)d=S.meta.firstUse;
  for(;d<=today;d=addDays(d,1)){
    for(const i of instancesOn(d)){
      if(S.log[i.key])continue;
      if(d===today&&i.end>nm)continue;
      if(diffDays(d,today)>EXPIRE_DAYS){S.log[i.key]=mk(i,'unanswered');changed=true;continue;}
      list.push(i);
    }
  }
  if(changed)save();
  list.sort((a,b)=>a.date!==b.date?(a.date<b.date?-1:1):a.end-b.end);
  return list;
}

/* ---------- main view ---------- */
let view=todayStr(), mode='day', sheetOn=false, sheetDismiss=false, gateOpen=false, hiddenAt=0;
function setMode(m){mode=m;render(true);}
function rawMonday(d){return addDays(d,-((dow(d)+6)%7));}
function weekStartOf(d){if(!S.meta.showWeekends&&(dow(d)===0||dow(d)===6))d=addDays(d,dow(d)===6?2:1);return rawMonday(d);}
function weekDates(){const m=weekStartOf(view),n=S.meta.showWeekends?7:5;return Array.from({length:n},(_,k)=>addDays(m,k));}
function shortD(d){return parse(d).toLocaleDateString(undefined,{month:'short',day:'numeric'});}
function step(dir){
  if(mode==='week'){view=addDays(view,7*dir);render(true);return;}
  let d=view;
  for(let k=0;k<8;k++){d=addDays(d,dir);const w=dow(d);if(S.meta.showWeekends||(w!==0&&w!==6))break;}
  view=d;render(true);
}
function goToday(){view=todayStr();render(true);}
function render(resetScroll){
  const today=todayStr();
  if(mode==='week'){const w=weekDates(),dw=diffDays(rawMonday(today),w[0]);
    $('#ttl').innerHTML=`<b>${shortD(w[0])} – ${shortD(w[w.length-1])}</b><small>${dw===0?'This week':dw===7?'Next week':dw===-7?'Last week':'&nbsp;'}</small>`;}
  else $('#ttl').innerHTML=`<b>${fmtDate(view)}</b><small>${rel(view)||'&nbsp;'}</small>`;
  const bn=$('#bankN');bn.textContent=S.bank.length;bn.style.display=S.bank.length?'':'none';
  const b=$('#banner');
  if(S.bank.length){
    b.classList.add('on');
    b.textContent=(view>today&&mode==='day')?`${S.bank.length} critical item${S.bank.length>1?'s':''} in the Bank. Place ${S.bank.length>1?'them':'it'} on this day or let ${S.bank.length>1?'them':'it'} go.`:`${S.bank.length} critical item${S.bank.length>1?'s':''} waiting in the Bank. Tap to review.`;
  } else b.classList.remove('on');
  $('#seg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.m===mode));
  renderTodo();
  $('#tl').style.display=mode==='week'?'none':'';$('#wk').style.display=mode==='week'?'block':'none';
  if(mode==='week'){renderWeek();if(resetScroll)$('#scroll').scrollTop=0;return;}
  renderTL();
  if(resetScroll){
    const sc=$('#scroll');let y=0;
    if(view===today){const m=nowMin();y=m>START?(m-START)/60*H-130:0;}
    else{const f=instancesOn(view).find(occ);y=f?(f.start-START)/60*H-40:(480-START)/60*H;}
    sc.scrollTop=Math.max(0,y);
  }
}
function renderTL(){
  let h='';
  for(let m=START;m<=END;m+=30){
    const top=(m-START)/60*H,full=m%60===0;
    h+=`<div class="hl${full?'':' half'}" style="top:${top}px"></div>`;
    if(full){const hh=m/60;h+=`<div class="hlab" style="top:${top}px">${hh%12||12} ${hh>=12?'PM':'AM'}</div>`;}
  }
  for(const i of instancesOn(view)) if(occ(i)) h+=blockHTML(i);
  h+='<div id="now" style="display:none"><i></i></div>';
  const tl=$('#tl');tl.style.height=((END-START)/60*H+110)+'px';tl.innerHTML=h;updateNow();
}
function blockHTML(i){
  const dur=i.end-i.start,top=(i.start-START)/60*H,ht=Math.max(14,dur/60*H-2);
  const l=S.log[i.key],done=l&&l.status==='done',c=CATS[i.cat]||CATS.personal;
  const tm=fmtT(i.start)+'–'+fmtT(i.end);
  const shr=(i.origLen&&i.origLen!==dur)?`${dur} min, originally ${i.origLen}`:'';
  const mkr=(i.critical?'<span class="mk" style="color:'+c.c+'">!</span>':'');
  const title=(done?'✓ ':'')+esc(i.title)+(i.kind==='series'?' ↻':'');
  let lines;
  if(dur<30) lines=`<div class="t">${title} <span style="font-weight:400;font-size:11px">· ${c.n}</span></div>`;
  else if(dur<45) lines=`<div class="t">${title}${mkr}</div><div class="s">${c.n} · ${esc(shr||i.note||tm)}</div>`;
  else lines=`<div class="t">${title}${mkr}</div><div class="s">${c.n} · ${tm}${shr?' · '+shr:''}</div>`+(i.note?`<div class="s">${esc(i.note)}</div>`:'');
  return `<div class="blk${done?' done':''}${dur<30?' tiny':''}" data-key="${i.key}" style="top:${top}px;height:${ht}px;background:${c.c}">${lines}</div>`;
}
const WH=30,GUT=34;
function renderWeek(){
  const days=weekDates(),n=days.length,today=todayStr(),names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const colL=k=>`calc(${GUT}px + (100% - ${GUT}px) * ${k} / ${n})`,colW=`calc((100% - ${GUT}px) / ${n})`;
  let head='<div class="wkhead">',body=`<div class="wkbody" style="height:${(END-START)/60*WH}px">`,nowCol=-1;
  for(let m=START;m<=END;m+=30){
    const top=(m-START)/60*WH,full=m%60===0;
    body+=`<div class="wkl${full?'':' half'}" style="top:${top}px"></div>`;
    if(full){const hh=m/60;body+=`<div class="wklab" style="top:${top}px">${hh%12||12}${hh>=12?'p':'a'}</div>`;}
  }
  days.forEach((d,k)=>{
    const isT=d===today;if(isT)nowCol=k;
    head+=`<button data-d="${d}" class="${isT?'today':''}" style="left:${colL(k)};width:${colW}">${names[dow(d)]}<b>${parse(d).getDate()}</b></button>`;
    body+=`<button class="wkcol" data-d="${d}" aria-label="Open ${fmtDate(d)}" style="left:${colL(k)};width:${colW};${isT?'background:#f3f4f6;':''}"></button>`;
    for(const i of instancesOn(d)){
      if(!occ(i))continue;
      const c=CATS[i.cat]||CATS.personal,dur=i.end-i.start,top=(i.start-START)/60*WH,ht=Math.max(6,dur/60*WH-1);
      const l=S.log[i.key],done=l&&l.status==='done';
      body+=`<div class="wkb${done?' done':''}" style="left:calc(${colL(k)} + 2px);width:calc(${colW} - 4px);top:${top}px;height:${ht}px;background:${c.c}">${dur>=60?esc(i.title):''}</div>`;
    }
  });
  if(nowCol>=0)body+=`<div id="wnow" style="left:${colL(nowCol)};width:${colW}"></div>`;
  $('#wk').innerHTML=head+'</div>'+body+'</div>';
  updateNow();
}
$('#wk').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(b){view=b.dataset.d;mode='day';render(true);}});
function updateNow(){
  const wn=$('#wnow');if(wn){const m2=nowMin();if(m2<START||m2>END)wn.style.display='none';else{wn.style.display='block';wn.style.top=((m2-START)/60*WH)+'px';}}
  const n=$('#now');if(!n)return;const m=nowMin();
  if(view!==todayStr()||m<START||m>END){n.style.display='none';return;}
  n.style.display='block';n.style.top=((m-START)/60*H)+'px';
}
$('#tl').addEventListener('click',e=>{const b=e.target.closest('.blk');if(b)openEdit(b.dataset.key);});
(function(){let x0,y0;const sc=$('#scroll');
  sc.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  sc.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;
    if(Math.abs(dx)>70&&Math.abs(dx)>2*Math.abs(dy))step(dx<0?1:-1);},{passive:true});
})();

/* ---------- to-do ---------- */
let todoOpen=true;try{todoOpen=localStorage.getItem('planner.todoOpen')!=='0';}catch(e){}
function toggleTodo(){todoOpen=!todoOpen;try{localStorage.setItem('planner.todoOpen',todoOpen?'1':'0');}catch(e){}renderTodo();}
function todoRow(t,leftover){
  return `<div class="titem${t.done?' done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="tToggle('${t.id}')" aria-label="Done"><span class="tx">${esc(t.text)}</span>`+
    (leftover?`<button class="mv" onclick="tMove('${t.id}')">Today</button>`:'')+
    `<button class="x" onclick="tDel('${t.id}')" aria-label="${leftover?'Drop':'Delete'}">✕</button></div>`;
}
function renderTodo(){
  const el=$('#todo');if(!el)return;
  if(mode==='week'){el.style.display='none';return;}
  el.style.display='';
  const prev=$('#t_in'),val=prev?prev.value:'',hadFocus=prev&&document.activeElement===prev;
  const today=todayStr(),todos=S.todos||[];
  const mine=todos.filter(t=>t.date===view);
  const left=view===today?todos.filter(t=>t.date<today&&!t.done):[];
  const open=mine.filter(t=>!t.done).length;
  const sum=(mine.length?(open?open+' left':'all done'):'empty')+(left.length?' · '+left.length+' leftover':'');
  let h=`<button class="thead" onclick="toggleTodo()">To-do <span>${sum} ${todoOpen?'▴':'▾'}</span></button>`;
  if(todoOpen){
    h+='<div id="tbody">'+mine.map(t=>todoRow(t,false)).join('');
    if(left.length)h+='<div class="tlo">Leftover from earlier days</div>'+left.sort((a,b)=>a.date<b.date?-1:1).map(t=>todoRow(t,true)).join('');
    h+=`<div class="tadd"><input id="t_in" class="in" placeholder="Add a small item" maxlength="80" enterkeyhint="done"><button onclick="tAdd()">Add</button></div></div>`;
  }
  el.innerHTML=h;
  const ni=$('#t_in');
  if(ni){ni.value=val;ni.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();tAdd();}};if(hadFocus)ni.focus();}
}
function tAdd(){
  const i=$('#t_in');if(!i)return;const v=i.value.trim();if(!v)return;
  S.todos=S.todos||[];S.todos.push({id:uid(),text:v.slice(0,80),date:view,done:false,ts:Date.now()});
  i.value='';save();renderTodo();const n=$('#t_in');if(n)n.focus();
}
function tToggle(id){const t=(S.todos||[]).find(x=>x.id===id);if(!t)return;t.done=!t.done;t.doneTs=t.done?Date.now():null;save();renderTodo();}
function tDel(id){S.todos=(S.todos||[]).filter(x=>x.id!==id);save();renderTodo();}
function tMove(id){const t=(S.todos||[]).find(x=>x.id===id);if(!t)return;t.date=todayStr();save();renderTodo();}

/* ---------- sheet ---------- */
function openSheet(html,dismiss){sheetOn=true;sheetDismiss=!!dismiss;$('#sheet').innerHTML=html;$('#modal').classList.add('on');}
function closeSheet(){sheetOn=false;$('#modal').classList.remove('on');$('#sheet').innerHTML='';tick();}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&sheetDismiss)closeSheet();});

/* ---------- gate ---------- */
let gKey=null,gStage='ask',gCrit=false;
function curG(){return pending()[0];}
function renderGate(){
  const p=pending(),g=$('#gate');
  if(!p.length){g.classList.remove('on');gateOpen=false;gKey=null;render();return;}
  const i=p[0];
  if(gKey!==i.key){gKey=i.key;gStage='ask';gCrit=!!i.critical;}
  gateOpen=true;g.classList.add('on');
  const c=CATS[i.cat]||CATS.personal;
  const card=`<div class="gcard" style="background:${c.c}"><b>${esc(i.title)}</b><div>${c.n} · ${fmtDate(i.date)} · ${fmtT(i.start)}–${fmtT(i.end)}</div>${i.note?`<div>${esc(i.note)}</div>`:''}</div>`;
  let body;
  if(gStage==='ask'){
    body=`<h2>Did you get it done?</h2>${card}<button class="btn pri" onclick="gDone()">Done</button><button class="btn sec" onclick="gNo()">Not done</button>`;
  } else {
    body=`<h2>What got in the way?</h2>${card}${i.kind==='series'?statLine(i.id):''}
    <label class="chk big"><input type="checkbox" ${gCrit?'checked':''} onchange="gSetCrit(this.checked)"> Critical: send it to the Bank so I reschedule it</label>
    ${REASONS.map(([k,t])=>`<button class="btn sec" onclick="gReason('${k}')">${t}</button>`).join('')}
    <button class="btn" onclick="gBack()">Back</button>`;
  }
  g.innerHTML=`<div class="gtop">Needs a decision · ${p.length} to answer</div>`+body;
}
function gDone(){const i=curG();if(!i)return;S.log[i.key]=mk(i,'done');save();gStage='ask';gKey=null;renderGate();}
function gNo(){gStage='why';renderGate();}
function gBack(){gStage='ask';renderGate();}
function gSetCrit(v){gCrit=!!v;}
function gReason(k){
  const i=curG();if(!i)return;
  if(gCrit){
    S.bank.push({id:uid(),title:i.title,cat:i.cat,note:i.note||'',origLen:i.origLen||(i.end-i.start),reason:k,from:i.date,seriesId:i.kind==='series'?i.id:null,ts:Date.now()});
    S.log[i.key]=mk(i,'banked',{reason:k});
  } else S.log[i.key]=mk(i,'skipped',{reason:k});
  save();gKey=null;renderGate();
}
function tick(){
  updateNow();
  if(gateOpen||sheetOn)return;
  if(pending().length)renderGate();
}

/* ---------- Bank ---------- */
let bankMode=null;
function openBank(){bankMode=null;renderBank();}
function renderBank(){
  const today=todayStr();
  if(bankMode){
    const b=S.bank.find(x=>x.id===bankMode.id);if(!b){bankMode=null;return renderBank();}
    if(bankMode.step==='reason'){
      openSheet(`<h3>Let go of “${esc(b.title)}”</h3><p class="mute">Why? One tap, and it's logged.</p>${LETGO.map(([k,t])=>`<button class="btn sec" onclick="bankReason('${k}')">${t}</button>`).join('')}<button class="btn" onclick="openBank()">Back</button>`,false);return;
    }
    const r=LETGO.find(x=>x[0]===bankMode.reason);
    openSheet(`<h3>Let go of a critical item?</h3><p>“${esc(b.title)}” was marked critical. Reason: ${esc(r?r[1]:'')}.</p><button class="btn dng" onclick="bankLetGo()">Yes, let it go</button><button class="btn" onclick="openBank()">Keep it in the Bank</button>`,false);return;
  }
  const items=S.bank.slice().sort((a,b)=>a.from<b.from?-1:1);
  const html=items.map(b=>{
    const c=CATS[b.cat]||CATS.personal,age=diffDays(b.from,today),r=REASONS.find(x=>x[0]===b.reason);
    return `<div class="bitem"><b><span class="bsw" style="background:${c.c}"></span>${esc(b.title)}</b>
    <div class="mute">${c.n} · ${fmtDur(b.origLen)} · from ${fmtDate(b.from)} (${age<=0?'today':age+' day'+(age>1?'s':'')} ago)${r?' · '+esc(r[1]):''}</div>
    ${b.note?`<div class="mute">${esc(b.note)}</div>`:''}${b.seriesId?statLine(b.seriesId):''}
    <div class="bact"><button class="btn pri" onclick="bankPlace('${b.id}')">Add to a day</button><button class="btn sec" onclick="bankDone('${b.id}')">Done</button><button class="btn dng" onclick="bankStart('${b.id}')">Let go</button></div></div>`;
  }).join('');
  openSheet(`<h3>Bank</h3>${items.length?'<p class="mute">Critical items you didn\'t get done. Place each on a day or let it go.</p>'+html:'<p class="mute">Nothing here. Critical items you skip will show up in the Bank.</p>'}<button class="btn" onclick="closeSheet()">Close</button>`,true);
}
function bankStart(id){bankMode={id,step:'reason'};renderBank();}
function bankReason(k){bankMode.step='confirm';bankMode.reason=k;renderBank();}
function bankLetGo(){
  const b=S.bank.find(x=>x.id===bankMode.id);
  if(b){S.log['bank:'+b.id]={status:'released',reason:bankMode.reason,title:b.title,cat:b.cat,critical:true,date:b.from,ts:Date.now(),kind:'bank'};S.bank=S.bank.filter(x=>x.id!==b.id);save();}
  bankMode=null;closeSheet();render();
}
function bankDone(id){
  const b=S.bank.find(x=>x.id===id);if(!b)return;
  S.log['bank:'+b.id]={status:'done_late',title:b.title,cat:b.cat,critical:true,date:b.from,ts:Date.now(),kind:'bank'};
  S.bank=S.bank.filter(x=>x.id!==id);save();renderBank();render();
}
function bankPlace(id){
  const b=S.bank.find(x=>x.id===id);if(!b)return;
  const today=todayStr();let d=view>today?view:addDays(today,1);
  while(!S.meta.showWeekends&&(dow(d)===0||dow(d)===6))d=addDays(d,1);
  closeSheet();
  openForm({mode:'new',bankId:id,prefill:{title:b.title,cat:b.cat,note:b.note,critical:true,origLen:b.origLen,dur:b.origLen,date:d}});
}

function openMenu(){

  <button class="btn sec" onclick="exportData()">Export backup</button>

async function exportData(){
  const json=JSON.stringify(S,null,1),name='planner-backup-'+todayStr()+'.json';
  S.meta.lastBackup=todayStr();save();
  try{
    const file=new File([json],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function importData(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{
    try{const j=JSON.parse(r.result);if(!(j&&j.v===1&&Array.isArray(j.events)&&Array.isArray(j.series)))throw 0;
      if(!confirm('This replaces everything currently in the planner with the backup. Continue?'))return;
      S=j;S.meta=Object.assign(fresh().meta,S.meta||{});S.log=S.log||{};S.bank=S.bank||[];S.todos=Array.isArray(S.todos)?S.todos:[];save();closeSheet();goToday();toast('Backup restored');
    }catch(x){toast('That file is not a valid planner backup.');}
  };r.readAsText(f);
}

/* ---------- event form ---------- */
let F=null,FO=null;
function newEvent(){
  const d=view;openForm({mode:'new',prefill:{date:d,dur:60}});
}
function openEdit(key){
  const [id,date]=key.split('@');const i=instancesOn(date).find(x=>x.key===key);if(i)openForm({mode:'edit',inst:i});
}
function recurOn(){return FO.mode==='new'?F.recur:(FO.inst.kind==='series'&&F.scope==='future');}
function excl(i){
  if(FO.mode!=='edit')return false;
  if(FO.inst.kind==='one'||F.scope==='one')return i.key===FO.inst.key;
  return i.id===FO.inst.id&&i.date>=F.date;
}
function candDates(){
  if(!recurOn())return [F.date];
  const out=[],lim=addDays(F.date,182);
  for(let d=F.date;d<=lim;d=addDays(d,1)){if(F.until&&d>F.until)break;if(F.days.includes(dow(d)))out.push(d);}
  return out;
}
function findConflict(){
  for(const d of candDates()){
    for(const i of instancesOn(d)){
      if(!occ(i)||excl(i))continue;
      if(i.start<F.end&&F.start<i.end)return i;
    }
  }
  return null;
}
function validate(){
  if(!F.title.trim())return {msg:''};
  if(!F.date)return {msg:'Pick a date.'};
  if(!Number.isFinite(F.start)||!Number.isFinite(F.end))return {msg:'Set a start and end time.'};
  if(F.start<START||F.end>END)return {msg:'Times must be between 6:00am and 10:00pm.'};
  if(F.end<=F.start)return {msg:'End must be after start.'};
  if(recurOn()){
    if(!F.days.length)return {msg:'Pick at least one day.'};
    if(F.until&&F.until<F.date)return {msg:'The end date is before the start date.'};
  }
  const c=findConflict();
  if(c)return {msg:`Overlaps “${c.title}”, ${fmtT(c.start)}–${fmtT(c.end)}${c.date!==F.date?' on '+fmtDate(c.date):''}.`};
  return null;
}
function openForm(o){
  FO=o;const inst=o.inst,p=o.prefill||{};
  const sr=(inst&&inst.kind==='series')?S.series.find(s=>s.id===inst.id):null;
  F={title:inst?inst.title:(p.title||''),date:inst?inst.date:(p.date||view),start:inst?inst.start:NaN,end:inst?inst.end:NaN,
     cat:inst?inst.cat:(p.cat||'study'),note:inst?(inst.note||''):(p.note||''),critical:inst?!!inst.critical:!!p.critical,
     origLen:inst?(inst.origLen||null):(p.origLen||null),scope:sr?'one':null,recur:false,days:sr?sr.days.slice():[],until:sr?(sr.until||''):''};
  if(!inst){
    const dur=p.dur||60;let s=firstGap(F.date,dur);if(s==null)s=540;
    F.start=s;F.end=Math.min(END,s+dur);F.days=[dow(F.date)];
  }
  const edit=o.mode==='edit',key=inst&&inst.key,lg=key&&S.log[key];
  const canDone=edit&&!lg&&inst.date<=todayStr(),canUndo=edit&&lg&&lg.status==='done';
  openSheet(`<h3>${edit?'Edit event':(o.bankId?'Place from Bank':'New event')}</h3>
  ${sr?`<div class="seg2"><label><input type="radio" name="scope" value="one" checked> This day only</label><label><input type="radio" name="scope" value="future"> This and future days</label></div>`:''}
  <div id="f_dateRow"><div class="row"><label>Date<input id="f_date" type="date" class="in" value="${F.date}"></label></div><div id="dateLbl" style="font-weight:700;margin:-4px 0 10px"></div></div>
  <input id="f_title" class="in" placeholder="Title" maxlength="60" value="${esc(F.title)}">
  <div class="row"><label>Start<input id="f_start" type="time" class="in" value="${toInT(F.start)}"></label><label>End<input id="f_end" type="time" class="in" value="${toInT(F.end)}"></label></div>
  <div id="prev"></div><div class="mute" id="durT" style="margin-bottom:8px"></div>
  <div class="chips" id="f_cats">${Object.entries(CATS).map(([k,v])=>`<button type="button" class="chip" data-c="${k}" style="--c:${v.c}">${v.n}</button>`).join('')}</div>
  <input id="f_note" class="in" placeholder="One-line note (optional)" maxlength="60" value="${esc(F.note)}">
  <label class="chk"><input type="checkbox" id="f_crit"> <b>Critical</b> <span id="critN" class="mute"></span></label>
  <div id="recWrap"><label class="chk"><input type="checkbox" id="f_rec"> Repeats weekly</label></div>
  <div id="recBox"><div class="chips" id="f_days">${[1,2,3,4,5,6,0].map(d=>`<button type="button" class="chip sm" data-d="${d}">${['Su','Mo','Tu','We','Th','Fr','Sa'][d]}</button>`).join('')}</div>
  <label class="mute">Repeat until (optional)<input id="f_until" type="date" class="in" value="${F.until}"></label></div>
  <div class="err" id="err"></div>
  <button class="btn pri" id="f_save">Save</button>
  ${canDone?'<button class="btn sec" id="f_done">Mark done now</button>':''}${canUndo?'<button class="btn sec" id="f_undo">Undo done</button>':''}
  <button class="btn" id="f_cancel">Cancel</button>
  ${edit?'<button class="btn dng" id="f_del">Delete</button>':''}`,false);
  wireForm();refreshForm();
  if(!edit)setTimeout(()=>{try{$('#f_title').focus();}catch(e){}},50);
}
function wireForm(){
  $('#f_title').oninput=e=>{F.title=e.target.value;refreshForm();};
  $('#f_note').oninput=e=>{F.note=e.target.value;};
  $('#f_date').onchange=e=>{F.date=e.target.value;refreshForm();};
  $('#f_start').oninput=e=>{
    const dur=F.end-F.start,s=fromInT(e.target.value);F.start=s;
    if(Number.isFinite(dur)&&dur>0&&Number.isFinite(s)){F.end=Math.min(END,s+dur);$('#f_end').value=toInT(F.end);}
    refreshForm();
  };
  $('#f_end').oninput=e=>{F.end=fromInT(e.target.value);refreshForm();};
  $('#f_cats').onclick=e=>{const b=e.target.closest('[data-c]');if(b){F.cat=b.dataset.c;refreshForm();}};
  $('#f_crit').onchange=e=>{F.critical=e.target.checked;refreshForm();};
  $('#f_rec').onchange=e=>{F.recur=e.target.checked;if(F.recur&&!F.days.length)F.days=[dow(F.date)];refreshForm();};
  $('#f_days').onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;const d=+b.dataset.d;F.days=F.days.includes(d)?F.days.filter(x=>x!==d):F.days.concat(d);refreshForm();};
  $('#f_until').onchange=e=>{F.until=e.target.value;refreshForm();};
  document.querySelectorAll('input[name=scope]').forEach(r=>r.onchange=e=>{F.scope=e.target.value;refreshForm();});
  $('#f_save').onclick=saveForm;
  $('#f_cancel').onclick=closeSheet;
  if($('#f_del'))$('#f_del').onclick=deleteFlow;
  if($('#f_done'))$('#f_done').onclick=()=>{S.log[FO.inst.key]=mk(FO.inst,'done');save();closeSheet();render();};
  if($('#f_undo'))$('#f_undo').onclick=()=>{delete S.log[FO.inst.key];save();closeSheet();render();};
}
const pct = m => ((m-START)/(END-START)*100);
function refreshForm(){
  const sr=FO.mode==='edit'&&FO.inst.kind==='series';
  $('#f_dateRow').style.display=sr?'none':'';
  $('#dateLbl').textContent=F.date?parse(F.date).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})+(rel(F.date)?' · '+rel(F.date):''):'';
  $('#recWrap').style.display=FO.mode==='new'?'':'none';
  $('#f_rec').checked=F.recur;
  $('#recBox').style.display=recurOn()?'':'none';
  $('#f_crit').checked=F.critical;
  document.querySelectorAll('#f_cats .chip').forEach(b=>b.classList.toggle('on',b.dataset.c===F.cat));
  document.querySelectorAll('#f_days .chip').forEach(b=>b.classList.toggle('on',F.days.includes(+b.dataset.d)));
  const validTimes=Number.isFinite(F.start)&&Number.isFinite(F.end)&&F.end>F.start;
  const dur=F.end-F.start;
  $('#durT').textContent=validTimes?fmtDur(dur)+((F.origLen&&F.origLen!==dur)?` (originally ${fmtDur(F.origLen)})`:''):'';
  const others=F.date?instancesOn(F.date).filter(i=>occ(i)&&!excl(i)):[];
  $('#critN').textContent=F.date?`· ${others.filter(i=>i.critical).length+(F.critical?1:0)} critical on this day`:'';
  const v=validate();
  let pv='';
  for(const i of others)pv+=`<i style="left:${pct(i.start)}%;width:${pct(i.end)-pct(i.start)}%;background:${(CATS[i.cat]||CATS.personal).c};opacity:.5"></i>`;
  if(validTimes&&F.start>=START&&F.end<=END)pv+=`<i class="g${v&&v.msg?' bad':''}" style="left:${pct(F.start)}%;width:${pct(F.end)-pct(F.start)}%"></i>`;
  const labs=[[360,'6a'],[540,'9a'],[720,'12p'],[900,'3p'],[1080,'6p'],[1260,'9p']].map(([m,t])=>`<span style="left:${pct(m)}%">${t}</span>`).join('');
  $('#prev').innerHTML=`<div class="prev">${pv}</div><div class="pl">${labs}</div>`;
  $('#err').textContent=v?v.msg:'';
  $('#f_save').disabled=!!v;
}
function saveForm(){
  if(validate())return;
  const base={title:F.title.trim(),start:F.start,end:F.end,cat:F.cat,note:F.note.trim(),critical:F.critical,origLen:F.origLen&&F.origLen!==(F.end-F.start)?F.origLen:null};
  const date=F.date;
  if(FO.mode==='new'){
    if(F.recur)S.series.push(Object.assign({id:uid(),days:F.days.slice(),from:date,until:F.until||null,skip:[],over:{}},base));
    else S.events.push(Object.assign({id:uid(),date},base));
    if(FO.bankId){S.log['bank:'+FO.bankId]={status:'placed',to:date,ts:Date.now(),kind:'bank'};S.bank=S.bank.filter(b=>b.id!==FO.bankId);}
  } else if(FO.inst.kind==='one'){
    Object.assign(S.events.find(e=>e.id===FO.inst.id),{date},base);
  } else {
    const sr=S.series.find(s=>s.id===FO.inst.id);
    if(F.scope==='one'){sr.over[date]=base;}
    else{
      const nu=Object.assign({},base,{days:F.days.slice(),until:F.until||null});
      if(date<=sr.from){Object.assign(sr,nu);for(const k of Object.keys(sr.over))if(k>=date)delete sr.over[k];}
      else{
        const old={until:sr.until};sr.until=addDays(date,-1);
        const skip=sr.skip.filter(d=>d>=date);
        S.series.push(Object.assign({id:uid(),from:date,skip,over:{}},nu));
        void old;
      }
    }
  }
  if(date<S.meta.firstUse)S.meta.firstUse=date;
  save();closeSheet();view=date;render(true);
}
function deleteFlow(){
  const inst=FO.inst;
  if(inst.kind==='one'){
    if(!confirm('Delete this event?'))return;
    S.events=S.events.filter(e=>e.id!==inst.id);save();closeSheet();render();return;
  }
  openSheet(`<h3>Delete repeating event</h3><p>“${esc(inst.title)}”</p>
  <button class="btn dng" onclick="delSeries('one')">This day only</button>
  <button class="btn dng" onclick="delSeries('future')">This and future days</button>
  <button class="btn" onclick="closeSheet()">Cancel</button>`,false);
}
function delSeries(scope){
  const inst=FO.inst,sr=S.series.find(s=>s.id===inst.id);
  if(sr){
    if(scope==='one')sr.skip.push(inst.date);
    else if(inst.date<=sr.from)S.series=S.series.filter(s=>s.id!==sr.id);
    else sr.until=addDays(inst.date,-1);
  }
  save();closeSheet();render();
}

/* ---------- start ---------- */
function init(){
  const ios=/iP(hone|ad|od)/.test(navigator.userAgent);
  if(ios&&!navigator.standalone&&!localStorage.getItem('planner.tipDismissed')){
    const t=$('#tip');t.classList.add('on');
    t.innerHTML='Add this page to your Home Screen before entering events. Data saved in Safari does not carry over to the installed app. <button onclick="dismissTip()">Got it</button>';
  }
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  render(true);tick();
  const last=S.meta.lastBackup||S.meta.firstUse;
  if(S.events.length+S.series.length>0&&diffDays(last,todayStr())>=14)setTimeout(()=>toast('Time for a backup: ⋯ menu, then Export backup'),1200);
  setInterval(tick,15000);
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){hiddenAt=Date.now();return;}
    if(hiddenAt&&Date.now()-hiddenAt>3600000&&!sheetOn&&!gateOpen){view=todayStr();mode='day';render(true);}
    tick();
  });
}
function dismissTip(){try{localStorage.setItem('planner.tipDismissed','1');}catch(e){}$('#tip').classList.remove('on');}
init();
</script>
